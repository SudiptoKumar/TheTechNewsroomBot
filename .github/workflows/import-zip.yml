name: Import Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      - name: Extract ZIP
        run: |
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -o "${{ steps.zip.outputs.ZIP }}" -d /tmp/project

      - name: Import project
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/project/ ./

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.ZIP }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import project from ZIP"
          git push
